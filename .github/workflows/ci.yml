name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: omnisuite
          POSTGRES_PASSWORD: omnisuite
          POSTGRES_DB: omnisuite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnisuite" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://omnisuite:omnisuite@localhost:5432/omnisuite
      APP_URL: http://localhost:4173
      AUTH_EMAIL_PASSWORD: "true"
      WORKER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Build (server mode)
        run: pnpm build
        env:
          RENDER_MODE: server
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:seed
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

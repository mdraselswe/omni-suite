# Production on one VPS: `docker compose -f docker-compose.prod.yml up -d --build`
# Secrets come from .env.production on the server (never committed). See docs/deployment.md.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnisuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: omnisuite
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnisuite"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://omnisuite:${POSTGRES_PASSWORD}@postgres:5432/omnisuite
      # Required: compose refuses to start without them (put them in the .env next to this
      # file, same values as .env.production). The app also refuses the public dev defaults.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (32+ random characters)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (32 random bytes, base64)}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - files:/app/storage

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Nightly pg_dump kept for 14 days in the "backups" volume (copy it off the server too).
  db-backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h postgres -U omnisuite -Fc omnisuite > /backups/omnisuite-$$(date +%F).dump;
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400; done'
    depends_on:
      postgres:
        condition: service_healthy

  # Off-server copy: every night the dumps and uploaded files go to a Cloudflare R2 bucket.
  # Turned off until R2_* is set in .env (docs/setup-guide-bn.md, section 5).
  # Dumps older than R2_KEEP_DAYS are removed from the bucket; files are only ever added.
  offsite-backup:
    image: rclone/rclone:1
    restart: unless-stopped
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-omnisuite-backups}
      R2_KEEP_DAYS: ${R2_KEEP_DAYS:-60}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # The token only has object access to one bucket, so don't try to create it.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - backups:/backups:ro
      - files:/files:ro
    entrypoint: >
      sh -c 'if [ -z "$$R2_ACCOUNT_ID" ] || [ -z "$$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ]; then
        echo "offsite-backup: R2 not configured, sleeping"; exec sleep infinity; fi;
        export RCLONE_CONFIG_R2_ENDPOINT="https://$$R2_ACCOUNT_ID.r2.cloudflarestorage.com";
        sleep 3600;
        while true; do
          rclone copy /backups "r2:$$R2_BUCKET/db" --include "*.dump" &&
          rclone delete "r2:$$R2_BUCKET/db" --min-age "$${R2_KEEP_DAYS}d" &&
          rclone copy /files "r2:$$R2_BUCKET/files" &&
          echo "offsite-backup: done $$(date -u +%FT%TZ)" ||
          echo "offsite-backup: FAILED $$(date -u +%FT%TZ)";
          sleep 86400; done'

volumes:
  pgdata:
  files:
  backups:
  caddy_data:
  caddy_config:

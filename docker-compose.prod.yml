# Production on one VPS: `docker compose -f docker-compose.prod.yml up -d --build`
# Secrets come from .env.production on the server (never committed). See docs/deployment.md.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnisuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: omnisuite
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnisuite"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://omnisuite:${POSTGRES_PASSWORD}@postgres:5432/omnisuite
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - files:/app/storage

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:?set APP_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Nightly pg_dump kept for 14 days in the "backups" volume (copy it off the server too).
  db-backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h postgres -U omnisuite -Fc omnisuite > /backups/omnisuite-$$(date +%F).dump;
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400; done'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  files:
  backups:
  caddy_data:
  caddy_config:
